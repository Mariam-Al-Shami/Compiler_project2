<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إضافة منتج</title>
    <style>
        body {
            font-family: Arial, sans-serif; background-color: #f9f9f9;
            margin: 20px auto; color: #333;
            max-width: 700px;
        }
        h1, h3 { color: #2c3e50; }
        a { text-decoration: none; color: #3498db; }
        a:hover { text-decoration: underline; }
        button {
            background-color: #3498db; color: white; border: none;
            padding: 8px 14px; cursor: pointer; border-radius: 4px;
        }
        button:hover { background-color: #2980b9; }
        form {
            background-color: #fff; padding: 20px; border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 400px;
        }
        form label {
            display: block; margin-top: 10px; font-weight: bold;
        }
        form input, form textarea {
            width: 100%; padding: 6px; margin-top: 4px;
            border: 1px solid #ccc; border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-back {
            display: inline-block;
            margin-top: 14px;
            background-color: #3498db;
            color: white;
            padding: 8px 14px;
            border-radius: 4px;
        }
        .btn-back:hover { background-color: #2980b9; text-decoration: none; }
    </style>
</head>
<body>
<h1>إضافة منتج جديد</h1>
<form action="{{ url_for('add_product') }}" method="POST" enctype="multipart/form-data">
    <label>الاسم :</label>
    <input type="text" name="name" value="{{ request.form.name }}" required>

    <label>السعر :</label>
    <input type="number" name="price" value="{{ request.form.price }}" required>

    <label>التفاصيل :</label>
    <textarea name="details" required>{{ request.form.details }}</textarea>

    <label>الصورة :</label>
    <input type="file" name="image" required>

    <button type="submit">حفظ</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<a href="{{ url_for('products') }}" class="btn-back"> رجوع إلى القائمة</a>
</body>
</html>
